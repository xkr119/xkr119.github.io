<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tak Kim — 앱 개인정보처리방침</title>
<style>
  :root {
    --bg: #fffdf7;
    --fg: #2e2418;
    --muted: #6b5d4a;
    --line: #e6ddc9;
    --accent: #8a6a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1712;
      --fg: #ece4d6;
      --muted: #a89982;
      --line: #3a3126;
      --accent: #d8b47c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.25rem 5rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
      "Apple SD Gothic Neo", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p.sub { color: var(--muted); margin: 0 0 2.5rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--line); }
  li:last-child { border-bottom: 1px solid var(--line); }
  a.app {
    display: block;
    padding: 1.1rem .25rem;
    color: inherit;
    text-decoration: none;
  }
  a.app:hover { color: var(--accent); }
  .name { font-weight: 600; }
  .desc { color: var(--muted); font-size: .9rem; }
  footer { margin-top: 3rem; color: var(--muted); font-size: .85rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body><main>
<h1>앱 개인정보처리방침</h1>
<p class="sub">Privacy policies for apps by Tak Kim</p>

<ul>

    <span class="name">카피도쿠 · Capydoku</span><br>
    <span class="desc">카피바라 논리 퍼즐 — 한국어 / English</span>
  </a></li>
  <li><a class="app" href="/capydoku/jagaemadang/privacy.html">
    <span class="name">자개마당</span><br>
    <span class="desc">네모로직 퍼즐</span>
  </a></li>
  <li><a class="app" href="/onlyonephoto-privacy/">
    <span class="name">한장만</span><br>
    <span class="desc">사진 정리 · 중복 사진 찾기</span>
  </a></li>
  <li><a class="app" href="/idle-defense-dist/privacy.html">
    <span class="name">냥캐슬 디펜스</span><br>
    <span class="desc">방치형 디펜스</span>
  </a></li>
</ul>

<footer>
문의: <a href="mailto:xkr119@gmail.com">xkr119@gmail.com</a>
</footer>
</main></body>
</html>
